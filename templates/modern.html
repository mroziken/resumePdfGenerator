<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ name }} - Resume</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h1 { border-bottom: 2px solid #ccc; }
        h2 { color: #555; margin-top: 20px; }
        .section { margin-bottom: 20px; }
    </style>
</head>
<body>
<h1>{{ name }}</h1>
<p>{{ email }} | {{ phone }}</p>
<div class="section">
    <h2>Summary</h2>
    <p>{{ summary }}</p>
</div>
<div class="section">
    <h2>Experience</h2>
    <ul>
    {% for item in experience %}
        <li>{{ item }}</li>
    {% endfor %}
    </ul>
</div>
<div class="section">
    <h2>Education</h2>
    <ul>
    {% for item in education %}
        <li>{{ item }}</li>
    {% endfor %}
    </ul>
</div>
<div class="section">
    <h2>Skills</h2>
    <ul>
    {% for skill in skills %}
        <li>{{ skill }}</li>
    {% endfor %}
    </ul>
</div>
</body>
</html>
