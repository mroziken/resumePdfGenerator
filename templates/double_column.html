<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ name }} - Resume</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { display: flex; }
        .left { width: 60%; padding-right: 20px; border-right: 1px solid #ddd; }
        .right { width: 40%; padding-left: 20px; }
        h1 { margin-bottom: 5px; }
        h2 { color: #555; margin-top: 20px; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>
<h1>{{ name }}</h1>
<p>{{ email }} | {{ phone }}</p>
<div class="container">
    <div class="left">
        <h2>Summary</h2>
        <p>{{ summary }}</p>
        <h2>Experience</h2>
        <ul>
        {% for item in experience %}
            <li>{{ item }}</li>
        {% endfor %}
        </ul>
    </div>
    <div class="right">
        <h2>Education</h2>
        <ul>
        {% for item in education %}
            <li>{{ item }}</li>
        {% endfor %}
        </ul>
        <h2>Skills</h2>
        <ul>
        {% for skill in skills %}
            <li>{{ skill }}</li>
        {% endfor %}
        </ul>
    </div>
</div>
</body>
</html>
